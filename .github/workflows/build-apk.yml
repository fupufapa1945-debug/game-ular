name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App & Build APK
        run: |
          cordova create build_app com.game.app "MyGame"
          rm -rf build_app/www/*
          shopt -s extglob
          cp -r !(build_app|.github|.git) build_app/www/
          cd build_app
          cordova platform add android
          cordova build android --verbose

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: game-app-debug
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
